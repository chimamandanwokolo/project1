<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Contact Form</title>
  </head>
  <body>
    <h1>Sign Up</h1>
    <img
      src="https://vspot.s3.amazonaws.com/sign-up/Logos/SignUp-Profile-Icon-v2.jpg"
      alt="https://vspot.s3.amazonaws.com/sign-up/Logos/SignUp-Profile-Icon-v2.jpg"
    />
    <h3>We will need your username,age and gender</h3>
    <h3>First your username</h3>
    <label for="username">username</label>
    <input type="text" id="username" name="username" required />
    <br />
    <br />
    <label for="gender">gender:</label>
    <br />

    <input type="radio" id="male" name="gender" value="male" />
    <label for="male">male</label>
    <br />
    <input type="radio" id="female" name="gender" value="female" />
    <label for="female">female</label>
    <br />
    <br />
    <label for="Age">Age:</label>
    <br />
    <br />
    <input type="age" id="age" name="age" value="1-5" />
    <input type="checkbox" id="age" name="age" value="5-10" />
    <br />
    <br />
    <input type="age" id="age" name="age" value="10-15" />
    <input type="checkbox" id="age" name="age" value="15-20" />
    <br />
    <br />
    <input type="age" id="age" name="age" value="20-25" />
    <input type="checkbox" id="age" name="age" value="25-30" />
    <br />
    <br />
    <input type="age" id="age" name="age" value="35-40" />
    <input type="checkbox" id="age" name="age" value="45-50" />
    <br />
    <br />
    <input type="age" id="age" name="age" value="55-60" />
    <br />
    <br />
    <input type="age" id="age" name="age" value="65-70+" />
    <input type="checkbox" id="age" name="age" value="" />
    <br />
    <br />
    <input type="submit" value="submit" />
    <h3>
      click this link after submiting!
      <a href="thanks
      
.html">Thanks for signing up</a>
    </h3>
  </body>
</html>
